<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
<meta charset="UTF-8">
<title>Employee Management System</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
	crossorigin="anonymous">


</head>
<body>

	<div class="container my-2">
		<h1>Employee Management System</h1>
		<h1>EMPLOYEES LIST</h1>
		<a th:href="@{/newEmployeeForm}" class="btn btn-primary">Add
			Employee</a>

		<table border=2 class='table table-striped table-responsive-md'>
			<tr>
				<th><a
					th:href="@{'/page/'+${currentPage}+'?sortField=firstName&sortDir='+${reverseSortDir}}">Employee
						First Name</a></th>
				<th><a
					th:href="@{'/page/'+${currentPage}+'?sortField=lastName&sortDir='+${reverseSortDir}}">Employee
						Last Name</a></th>
				<th><a
					th:href="@{'/page/'+${currentPage}+'?sortField=email&sortDir='+${reverseSortDir}}">Employee
						Email</a></th>
				<th>Actions</th>
			</tr>
			<tr th:each="employee:${listEmployees}">
				<td th:text=${employee.firstName}></td>
				<td th:text=${employee.lastName}></td>
				<td th:text=${employee.email}></td>
				<td><a th:href="@{/showFormForUpdate/{id}(id=${employee.id})}"
					class="btn btn-primary">Update</a> <a
					th:href="@{/deleteEmployee/{id}(id=${employee.id})}"
					class="btn btn-danger">Delete</a></td>
			</tr>
		</table>
		<div th:if="${totalPages>1}" align="center">

			<div class="row">

				<div class="col-sm-1 pagination">
					<span th:each="i:${#numbers.sequence(1,totalPages)}"
						class="page-item"> <a th:if="${currentPage!=i}"
						th:href="@{'/page/'+${i}+'?sortField='+${sortField}+'&sortDir='+${sortDir}}"
						class="page-link">[[${i}]]</a> <span th:unless="${currentPage!=i}"
						class="page-item active"><a class="page-link">[[${i}]]</a></span>

					</span> <span class="page-item"> <a
						th:if="${currentPage<totalPages}"
						th:href="@{'/page/'+${currentPage + 1}+'?sortField='+${sortField}+'&sortDir='+${sortDir}}"
						class="page-link">Next</a></span> <span
						th:unless="${currentPage<totalPages}" class="page-item"><a
						class="page-link">Next</a></span> <span class="page-item"> <a
						th:if="${currentPage<totalPages}"
						th:href="@{'/page/'+${totalPages}+'?sortField='+${sortField}+'&sortDir='+${sortDir}}"
						class="page-link">Last</a></span> <span
						th:unless="${currentPage<totalPages}" class="page-item"><a
						class="page-link">Last</a></span>
				</div>


			</div>
		</div>
	</div>
</body>
</html>
