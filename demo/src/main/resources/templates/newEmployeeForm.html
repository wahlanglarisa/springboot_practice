<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" 
rel="stylesheet" 
integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" 
crossorigin="anonymous">
</head>
<body>
<div class="container">
<h1>Employee Management System</h1>
<hr>
<h2>Save Employee</h2>
<form th:action="@{/saveEmployee}" th:object="${employee}" method="POST">
<input type="text" th:field="*{firstName}" 
placeholder="Employee First Name" class="form-control mb-4">
<input type="text" th:field="*{lastName}" 
placeholder="Employee Last Name" class="form-control mb-4">
<input type="text" th:field="*{email}" 
placeholder="Employee Email" class="form-control mb-4">
<button type="Submit">Save Employee</button>
</form>
</div>
</body>
</html>
