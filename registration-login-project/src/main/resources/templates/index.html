<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Home</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
	crossorigin="anonymous">
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
	integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
	crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
	<nav class="navbar" style="background-color: #e3f2fd;">
		<div class="container-fluid">
			<a class="navbar-brand" href="#"> Registration and Login Module </a>
			<div class="d-flex">
				<a class="navbar-brand" th:href="@{/logout}"> Logout </a>
			</div>
		</div>

	</nav>
	<br>
	<br>
	<div class='container'>
		<h1>Hello [[${user.firstName}]] [[${user.lastName}]] you are
			logged in</h1>
		<hr />
	</div>
	<div class="container">
    <div class="row align-items-center" style="background-color: #80ccff;border-radius: 500px;">
        <!-- User image -->
        <div class="col-md-4 text-center">
            <img th:src="@{/User.png}" class="img-thumbnail" alt="User Image" style="max-width: 200px; border-radius: 500px;">
        </div>

        <!-- User details -->
        <div class="col-md-8">
            <div class="row mb-3">
                <div class="col-sm-3 fw-bold">Name</div>
                <div class="col-sm-9">[[${user.firstName}]] [[${user.lastName}]]</div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-3 fw-bold">Email</div>
                <div class="col-sm-9">[[${user.email}]]</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
