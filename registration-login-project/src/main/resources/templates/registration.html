<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registration</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
	crossorigin="anonymous">
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
	integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
	crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
	<!-- create navigation bar -->
	<nav class="navbar" style="background-color: #e3f2fd;">
		<div class="container-fluid">
			<a class="navbar-brand" href="#"> Registration and Login Module </a>
		</div>
	</nav>
	<br>
	<br>
	<div class="container">
		<div class="row">
			<div class="col-md-6 col-md-offset-3">
				<div th:if="${param.success}">
					<div class="alert alert-info">You have successfully
						registered to our awesome app!!!!</div>

				</div>
				<h1>Registration</h1>
				<form th:action="@{/registration}" method="post" th:object="${user}">
					<div class='form-group'>
						<label class="control-label" for="firtsName"> First Name </label>
						<input id="firstName" class="form-control" th:field="*{firstName}"
							required autofocus="autofocus">
					</div>
					<div class='form-group'>
						<label class="control-label" for="firtsName"> Last Name </label> <input
							id="lastName" class="form-control" th:field="*{lastName}"
							required autofocus="autofocus">
					</div>
					<div class='form-group'>
						<label class="control-label" for="firtsName"> Email </label> <input
							id="email" class="form-control" th:field="*{email}" required
							autofocus="autofocus"><span id="emailError"
							style="color: red;"></span>
					</div>
					<div class='form-group'>
						<label class="control-label" for="firtsName">Password </label> <input
							class="form-control" type="password" th:field="*{password}"
							required autofocus="autofocus" id="password"><input
							class="form-check-input" type="checkbox" value=""
							id="checkDefault"><label>Show Password</label><span id="passError"
							style="color: red;"></span>
					</div>
					<div class="form-group">
						<button type="submit" class="btn btn-success" id="reg-button">Register</button>
						<span>Already registered? <a href="/" th:href="@{/login}">Login
								here</a></span>
					</div>
				</form>
			</div>
		</div>
	</div>
	<script type="text/javascript" th:src="@{/main.js}"></script>

	<!-- create HTML registration form -->
</body>
</html>
