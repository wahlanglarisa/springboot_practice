<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link

	rel="stylesheet"
	integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
	crossorigin="anonymous">
<!--  -->
<link th:href=@{/css/student.css} rel="stylesheet" />
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
	integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
	crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<header th:insert="@{/fragments/prof_header.html}"> </header>
<br>
<br>
<body>

	<main id="main-content">

		<div class="container">

			<div class=" row parentRow justify-content-center">
				<div class="col-md-3 mx-2 p-3 text-center  routineBlock shadow-lg">
					<strong>You have total [[${classCount.size()}]] class(es)
						today</strong> <br> <br> <a th:href="@{/professor/viewRoutine/{day}(day=${#temporals.dayOfWeekName(date)})}"
						class="link">View Routine</a>
				</div>
				<br>


				<div class="col-md-7 routineBlock shadow-lg">
					<strong>Your Classes</strong>
					<table class='table'>
						<thead>
							<tr>
								<th>Course Name</th>
								<th>Number of Classes</th>
							</tr>
							<tr th:each="class : ${classCount}">
								<td th:text="${class.courseName}"></td>
								<td th:text="${class.count}"></td>
							</tr>
						</thead>
					</table>

				</div>
			</div>
			<br> <br>
			<div class=" row parentRow justify-content-center">

				<div class="col-md-6 routineBlock shadow-lg">
					<strong> Your Upcoming Classes</strong> <br> <br>
					<table class='table'
						style="background-color: #D1E7E8; border-radius: 50px;">


						<thead>
							<tr>
								<th>Course Name</th>
								<th>Time</th>
								<th>Day</th>
								<Th>Actions</Th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="routine ,iter : ${routines}">
								<td th:text="${routine.courseName}" th:classappend="${iter.index>=3}?'hidden-row':''"></td>
								<td th:text="${routine.time}" th:classappend="${iter.index>=3}?'hidden-row':''"></td>
								<td th:text="${routine.day}" th:classappend="${iter.index>=3}?'hidden-row':''"></td>
								<td><a
									th:href="@{/professor/attendancePage/{id}(id=${routine.id})}"
									class="btn btn-primary">Take Attendance</a>&nbsp;&nbsp;<a
									th:href="@{/professor/createTestPage/{courseID}/{profID}/{classID}(courseID=
									${routine.courseID},profID=${professor.ID},classID=${routine.id})}"
									class="btn btn-primary">Create Test</a></td>
							</tr>

						</tbody>

					</table>
					<span th:if="${routines.size()>3}"><a th:href="@{/professor/viewAllClasses}"
						class="btn btn-primary form-submit">View Classes</a></span>
				</div>
				<br>
				<div class="col-md-6 routineBlock shadow-lg">
					<strong> Your Tests</strong> <br> <br>
					<table class='table'
						style="background-color: #D1E7E8; border-radius: 50px;">


						<thead>
							<tr>
								<th>Course Name</th>
								<th>Time</th>
								<th>Date</th>
								<Th>Actions</Th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="routine : ${tests}">
								<td th:text="${routine.course.courseName}"></td>
								<td th:text="${routine.time}"></td>
								<td th:text="${routine.date}"></td>
								<td><a
									th:href="@{/professor/addMarksStudents/{testID}(testID=${routine.id})}"
									class="btn btn-primary">Add Marks</a></td>
							</tr>

						</tbody>

					</table>
					<span><a th:href="@{/professor/viewAllClasses}"
						class="btn btn-primary form-submit">View Tests</a></span>
				</div>
				<br>
				<!--<div class="col-md-6 routineBlock shadow-lg">
				<strong> Your Course Test Results. Congrats </strong> <br> <br>
				<table class='table routineBlock'
					style="background-color: #D1E7E8; border-radius: 50px;">


					<thead>
						<tr>
							<th>Course Name</th>
							<th>Total Marks</th>
							<th>Marks Obtained</th>
							<th>Percentage of Marks</th>

						</tr>
					</thead>
					<tbody>
						<tr th:each="result : ${results}">
							<td th:text="${result.courseName}"></td>
							<td th:text="${result.totalMarks}"></td>
							<td th:text="${result.marksObtained}"></td>
							<td th:text="${result.percentage}"></td>

						</tr>

					</tbody>

				</table>
			</div>
		</div>-->
			</div>
		</div>
	</main>



</body>
<div class="container">

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    th:insert="@{/fragments/footer.html}">
</div>
