<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<link th:href=@{/css/student.css} rel="stylesheet" />

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
		integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<title>Insert title here</title>
</head>
<header th:insert="@{/fragments/hod_header.html}"> </header>

<body>
	<br><br><br><br>
	<main id="main-content">

		<div class='container-md'>
			<div th:if="${param.success}">
				<div class="alert alert-info">You have successfully registered
					to our awesome app!!!!</div>

			</div>
			<form th:action="@{/hod/updateClass}" method="post" th:object="${class}">
				<input type="hidden" th:value='${class.id}' th:field='${class.id}'>
				<input type="hidden" th:value='${class.course.id}' th:field='${class.course.id}'>

				<h1><strong>Update for
						[[${class.course.courseName}]]</strong></h1>
				<div th:if="${param.error}">
					<div class="alert alert-danger">Invalid username or password.</div>
				</div>

				<!-- logout message -->
				<div th:if="${param.logout}">
					<div class="alert alert-info">You have been logged out.</div>
				</div>
				<div class="mb-3 row">
					<label for="exampleFormControlInput1" class="form-label col col-sm-1">Select Professor</label>
					<select class="form-select col" th:field="*{professor}">
						<option th:each="professor:${professors}"
							th:text="${professor.firstName}+' '+${professor.lastName}" th:value="${professor.ID}">
						</option>
					</select>
				</div>
				<div class="mb-3 row">
					<label for="exampleFormControlInput1" class="form-label col col-sm-1">Enter new Time</label> <input
						type="time" class="form-control col" id="time" th:field="*{time}">
				</div>
				<div class="mb-3 row">
					<label for="exampleFormControlTextarea1" class="form-label col-sm-1">Select
						New Day</label> <select class='form-select' th:field="*{day}">
						<option value="Monday">Monday</option>
						<option value="Tuesday">Tuesday</option>
						<option value="Wednesday">Wednesday</option>
						<option value='Thursday'>Thursday</option>
						<option value='Friday'>Friday</option>
					</select>
				</div>
				<div class="mb-3 row">
					<label for="semester">Enter the Semester</label><input type="text" th:field="*{semester}"
						class="form-control" id="semester">

				</div>

				<div class="mb-3 row">
					<select class='form-select' th:field="*{branch}">
						<option selected="selected" value=0>Select the Branch</option>
						<option th:each="branch: ${branches}" th:text="${branch.branchName}" th:value="${branch.id}">
						</option>
					</select>

				</div>
				<div class="mb-3">
					<!-- <table>
					
					<tr th:each="course, itemStat : *{courses}">
						<td><input
							th:field="*{course[__${itemStat.index}__].courseName}" /></td>
					</tr>

				</table> -->
					<br> <input type="submit" class="btn btn-primary form-control" id="submit_button">
				</div>
			</form>
		</div>
	</main>
</body>
</body>
<div class="container">

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    th:insert="@{/fragments/footer.html}">
</div>
</html>
