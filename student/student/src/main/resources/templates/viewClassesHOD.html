<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
	rel="stylesheet"
>

<link th:href=@{/css/student.css} rel="stylesheet" />
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
	></script>
</head>
<header th:insert="~{/fragments/hod_header :: hod_header}"> </header>
<body>

	<br>
	<br>
	<main id="main-content">

		<div class="parentRow text-center container">

			<div class="routineBlock shadow-lg">

				<h3>
					<strong>Your Classes</strong>
				</h3>
				<br> <br>
				<table>

					<thead>
						<tr>
							<th>Course Name</th>
							<th>Time</th>
							<th>Day</th>
							<Th>Actions</Th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="routine : ${routines}">
							<td th:text="${routine.courseName}"></td>
							<td th:text="${routine.time}"></td>
							<td th:text="${routine.day}"></td>
							<td><a
								th:href="@{/hod/createTestPage/{courseID}/{profID}/{classID}(courseID=
									${routine.courseID},profID=${professor.ID},classID=${routine.id})}"
								class="btn btn-primary">Create Test</a></td>
						</tr>

					</tbody>

				</table>
			</div>
		</div>
	</main>
</body>
<div class="container">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
