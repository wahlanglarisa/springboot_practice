<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
	crossorigin="anonymous"></script>

<title>Insert title here</title>
</head>
<body>
	<nav class="navbar bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="#"> <strong>University
					Management System</strong>
			</a>
		</div>
	</nav>
	<br>
	<br>
	<div class='container'>
		<form th:action="@{/login}" method="post">
		<div th:if="${param.error}">
						<div class="alert alert-danger">Invalid username or
							password.</div>
					</div>

					<!-- logout message -->
					<div th:if="${param.logout}">
						<div class="alert alert-info">You have been logged out.</div>
					</div>
			<div class="mb-3">
				<label for="exampleFormControlInput1" class="form-label">Email
					address</label> <input type="text" class="form-control" 
					placeholder="name@example.com" name="username" id="username">
			</div>
			<div class="mb-3">
				<label for="exampleFormControlTextarea1" class="form-label">Password</label>
				<input type="password" class="form-control" id="password" name="password"
					placeholder="Enter your password">
			</div>
			<div class="mb-3">
				
				<input type="submit" class="btn btn-primary" id="submit_button"
					>
					
			</div>
			
		</form>
		<a th:href="@{/registerStudent}">New User? Register Here</a>
		
	</div>
</body>
</html>
