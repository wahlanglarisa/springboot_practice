<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--  -->
    <link th:href=@{/css/student.css} rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<header th:insert="fragments/hod_header :: hod_header"> </header>

<body>
    <Br>
    <br>
    <br>
    <main id="main-content">
        <div class="routineBlock shadow-lg">
            <h3><strong>Department Professors</strong></h3>
            <table class="table table-striped table-sm">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Classes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prof : ${professors}">
                        <td th:text="${prof.firstName} + ' ' + ${prof.lastName}"></td>
                        <td th:text="${prof.email}"></td>
                        <td th:text="${prof.class_Course.size()}"></td>
                    </tr>
                </tbody>
            </table>

        </div>
    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

<div class="container">

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    th:insert="/fragments/footer :: footer">
</div>
</html>
