<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
     >
    <!--  -->
    <link th:href=@{/css/student.css} rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
       ></script>
</head>
<header th:insert="/fragments/prof_header :: prof_header"> </header>

<body>
    <br>
    <br>
    <br>
    <br>
    <main id="main-content" class=" justify-content-center text-center">
        <div>
            <h3>View Routine</h3>

        </div>
        <div class='container routineBlock'>
            <div th:if="${param.success}">
                <div class="alert alert-info">You have successfully registered
                    to our awesome app!!!!</div>

            </div>
            <form th:action="@{/hod/saveStudenClass/}" method="post" th:object="${saveClass}">
                <div th:if="${param.error}">
                    <div class="alert alert-danger">Invalid username or password.</div>
                </div>

                <!-- logout message -->
                <div th:if="${param.logout}">
                    <div class="alert alert-info">You have been logged out.</div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>
                                Course Name
                            </th>
                            <th>
                                <select class="form-select" onchange='clicked()' id="day_Select">
                                    <option value="0" selected>Select a Day for Filtering</option>
                                    <option value="Monday">Monday</option>
                                    <option value="Tuesday">Tuesday</option>
                                    <option value="Wednesday">Wednesday</option>
                                    <option value="Thursday">Thursday</option>
                                    <option value="Friday">Friday</option>


                                </select>
                            </th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="routine_table_body">
                        <tr th:each="class,item :${routine}">
                            <td th:text="${class.courseName}"></td>
                            <td th:text="${class.day}"></td>
                            <td th:text="${class.time}"></td>
                            
                        </tr>

                    </tbody>
                </table>
            </form>
        </div>
    </main>
</body>
<script>
    function courseclick(item){
		alert(item);
	}
	function clicked() {
            const contextPath = window.location.pathname.split('/')[1]; // grabs student-0.0.1-SNAPSHOT

		$.ajax({
			url: "/"+contextPath+"/professor/viewRoutine/",
			method: "get",
			dataType:"json",
			data: {
				day: document.getElementById("day_Select").value
			}
			, success: function (response) {
				courseElement = document.getElementById("routine_table_body")
				courseElement.innerHTML="";
					response.forEach(element => {
						i = 0
						newRow = courseElement.insertRow(i)
						cell = newRow.insertCell(0)
						cell.innerHTML = `${element.courseName}`
                        cell2 = newRow.insertCell(1)
						cell2.innerHTML = `${element.day}`
                              cell3 = newRow.insertCell(2)
						cell3.innerHTML = `${element.time}`
						console.log(element)
						i++;
					});
			}
		})
	}
</script>
<div class="container">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    th:insert="fragments/footer :: footer">
</div>
</html>
