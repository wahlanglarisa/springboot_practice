<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
		integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<title>Insert title here</title>
	<link th:href="@{/css/admin.css}" rel="stylesheet">
<link th:href=@{/css/student.css} rel="stylesheet" />
</head>
<header th:insert="/fragments/admin_header :: admin_header"> </header>

<body>
	<br>
	<br>
	<br>
	<br>
	<main id="main-content">
		<div class='container-md'>
			<div th:if="${param.success}">
				<div class="alert alert-info">You have successfully
					registered to our awesome app!!!!</div>

			</div>
			<form th:action="@{/admin/updateUser}" method="post" th:object="${user}">
				<input type="hidden" th:value='${user.id}' th:field='${user.id}'>
				<div th:if="${param.error}">
					<div class="alert alert-danger">Invalid username or password.</div>
				</div>

				<!-- logout message -->
				<div th:if="${param.logout}">
					<div class="alert alert-info">You have been logged out.</div>
				</div>
				<div class="mb-3 row">
					<label for="exampleFormControlInput1" class="form-label col col-sm-1">Enter new First Name</label>
					<input type="text" class="form-control col" id="st_name" th:field="*{firstName}">
				</div>
				<div class="mb-3 row">
					<label for="exampleFormControlInput1" class="form-label col col-sm-1">Enter new Last Name</label>
					<input type="text" class="form-control col" id="st_name" th:field="*{lastName}">
				</div>
				<div class="mb-3 row">
					<label for="exampleFormControlTextarea1" class="form-label col-sm-1">Enter
						new Email ID</label> <input type="text" class="form-control col" id="emailid"
						placeholder="Enter your Email ID" th:field="*{email}">
				</div>

				<div class="mb-3 row">
					<label for="exampleFormControlTextarea1" class="form-label col-sm-1">Enter
						new password</label> <input type="password" class="form-control col" id="emailid"
						placeholder="Enter your Password" th:field="*{password}" th:value="*{password}">
				</div>

				<div class="mb-3">
					<!-- <table>
					
					<tr th:each="course, itemStat : *{courses}">
						<td><input
							th:field="*{course[__${itemStat.index}__].courseName}" /></td>
					</tr>

				</table> -->
					<br>
					<input type="submit" class="btn btn-primary form-control" id="submit_button">
				</div>
			</form>
		</div>
	</main>
</body>
</body>
<div class="container">

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    th:insert="fragments/footer :: footer">
</div>
</html>
