<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
	crossorigin="anonymous">
<!--  -->
<link th:href=@{/css/student.css} rel="stylesheet" />
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
	integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
	crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
	<nav class="navbar bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="#"> <strong>University
					Management System</strong>
			</a>
		</div>
	</nav>
	<br>
	<br>
	<div class='container-md'>
		<div th:if="${param.success}">
			<div class="alert alert-info">You have successfully registered
				to our awesome app!!!!</div>

		</div>
		<form th:action="@{/hod/saveClass}" method="post" th:object="${class}">
			<div th:if="${param.error}">
				<div class="alert alert-danger">Invalid username or password.</div>
			</div>

			<!-- logout message -->
			<div th:if="${param.logout}">
				<div class="alert alert-info">You have been logged out.</div>
			</div>
			<div class="mb-3 row">
				<select th:field="*{course_class}" class='form-select'>
					<option selected value=0>Select a course</option>
					<option th:each="course,itemStat:${courses}" th:text="${course.courseName}"
						th:value="${course.id}"
						></option>

				</select>
					<select th:field="*{professor}" class='form-select'>
					<option selected value=0>Select a Professor</option>
					<option th:each="professor:${professors}" th:text="${professor.firstName}+' '+${professor.lastName}"
						th:value="${professor.ID}"
						></option>

				</select>
				<label for="time">Enter the Time </label><input type="time" class="form-control col" id='time' th:field="*{time}">
			</div>
			<div class="mb-3 row">
			<select  class='form-select'><option selected="selected" >Select Day</option>
			<option>Monday</option>
			<option >Tuesday</option>
			<option>Wednesday</option>
			<option >Thursday</option>
			<option >Friday</option>
			</select>
			</div>
			

			<div class="mb-3">
				<!-- <table>
					
					<tr th:each="course, itemStat : *{courses}">
						<td><input
							th:field="*{course[__${itemStat.index}__].courseName}" /></td>
					</tr>

				</table> -->
				<br> <input type="submit" class="btn btn-primary form-control"
					id="submit_button">
			</div>
		</form>
	</div>
</body>
</html>
