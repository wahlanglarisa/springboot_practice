<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
	<!--  -->
	<link th:href=@{/css/student.css} rel="stylesheet" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
		integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<header th:insert="fragments/hod_header :: hod_header"
></header>

<body>
	<br>
	<br>
	<br>
	<br>
	<main id="main-content">

		<div class='container routineBlock'>
			<div th:if="${param.success}">
				<div class="alert alert-info">You have successfully registered
					to our awesome app!!!!</div>

			</div>
			<form th:action="@{/hod/saveClass}" method="post" th:object="${class}">
				<div th:if="${param.error}">
					<div class="alert alert-danger">Invalid username or password.</div>
				</div>

				<!-- logout message -->
				<div th:if="${param.logout}">
					<div class="alert alert-info">You have been logged out.</div>
				</div>
				<div class="mb-3 row">
					<select th:field="*{course}" class='form-select'>
						<option selected value=0>Select a course</option>
						<option th:each="course,itemStat:${courses}" th:text="${course.courseName}"
							th:value="${course.id}"></option>

					</select> <select th:field="*{professor}" class='form-select'>
						<option selected value=0>Select a Professor</option>
						<option th:each="professor:${professors}"
							th:text="${professor.firstName}+' '+${professor.lastName}" th:value="${professor.ID}">
						</option>

					</select>
				</div>
				<div class='mb-3 row'> <label for="time" class='col-3'>Select the Time </label><input type="time"
						class="form-control col-3" id='time' th:field="*{time}"></div>
				<div class="mb-3 row">
					<select class='form-select' th:field="*{day}">
						<option selected="selected" value=0>Select Day</option>
						<option value="Monday">Monday</option>
						<option value="Tuesday">Tuesday</option>
						<option value="Wednesday">Wednesday</option>
						<option value='Thursday'>Thursday</option>
						<option value='Friday'>Friday</option>
					</select>
				</div>
				<div class="mb-3 row">
					<label for="semester">Enter the Semester</label><input type="text" th:field="*{semester}"
						class="form-control" id="semester">

				</div>

				<div class="mb-3 row">
					<select class='form-select' th:field="*{branch}">
						<option selected="selected" value=0>Select the Branch</option>
						<option th:each="branch: ${branches}" th:text="${branch.branchName}" th:value="${branch.id}"></option>
					</select>

				</div>
				<div class="mb-3 row">
					<input type="text" placeholder="Enter some Remarks" th:field="*{remarks}" class="form-control">
					</select>

				</div>
				<div class="mb-3">
					<!-- <table>
					
					<tr th:each="course, itemStat : *{courses}">
						<td><input
							th:field="*{course[__${itemStat.index}__].courseName}" /></td>
					</tr>

				</table> -->
					<br> <input type="submit" class="btn btn-primary form-control" id="submit_button">
				</div>
			</form>
		</div>
	</main>
</body>
<div class="container">

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    th:insert="fragments/footer :: footer">
</div>
</html>
