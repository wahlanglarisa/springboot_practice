<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
	crossorigin="anonymous">
<!--  -->
<link th:href=@{/css/student.css} rel="stylesheet" />
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
	integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
	crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">Navbar scroll</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarScroll"
				aria-controls="navbarScroll" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarScroll">
				<ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll"
					style="--bs-scroll-height: 100px;">
					<li class="nav-item"><a class="nav-link active"
						aria-current="page" href="#">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="#">Link</a></li>
					<li class="nav-item dropdown"><a
						class="nav-link dropdown-toggle" href="#" role="button"
						data-bs-toggle="dropdown" aria-expanded="false"> Link </a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" href="#">Action</a></li>
							<li><a class="dropdown-item" href="#">Another action</a></li>
							<li><hr class="dropdown-divider"></li>
							<li><a class="dropdown-item" href="#">Something else
									here</a></li>
						</ul></li>
					<li class="nav-item"><a class="nav-link disabled"
						aria-disabled="true">Link</a></li>
				</ul>

				<span class="d-flex"><strong>Hi, [[${user}]]</strong></span>&nbsp;&nbsp;
				<span class="d-flex"><a th:href="@{/logout}">Logout</a></span>
			</div>
		</div>
	</nav>
	<br>
	<br>
	<div class="parentRow text-center">

		<div class="routineBlock shadow-lg">
			<div class='d-flex'>
	<a th:href="@{/hod/addNewClassPage}" class="btn btn-primary"
						>Add New Class</a>&nbsp;&nbsp;</div>
			<strong>Department Classes</strong> <br> <br>
			<table class='table'
				style="background-color: #D1E7E8; border-radius: 50px;">


				<thead>
					<tr>
						<th>Course Name</th>
						<th>Time</th>
						<th>Day</th>
						<Th>Actions</Th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="routine : ${routines}">
						<td th:text="${routine.courseName}"></td>
						<td th:text="${routine.time}"></td>
						<td th:text="${routine.day}"></td>
						<td><a
							th:href="@{/professor/attendancePage/{id}(id=${routine.id})}"
							class="btn btn-primary">Update Class</a>&nbsp;&nbsp;<a
							th:href="@{/professor/attendancePage/{id}(id=${routine.id})}"
							class="btn btn-danger">Delete Class</a></td>
					</tr>

				</tbody>

			</table>
		</div>
	</div>
</body>
</html>
