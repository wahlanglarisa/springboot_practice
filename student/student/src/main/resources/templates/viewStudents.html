<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
	<!--  -->
	<link th:href=@{/css/student.css} rel="stylesheet" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
		integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<header th:insert="fragments/hod_header :: hod_header"
></header>
<br><br>
<br><br>

<body>
	<main id="main-content">

		<div class='container'>
			<div class="routineBlock shadow-lg text-center">
				<h1 class='text-center'> Department Students</h1> <br> <br>
				<table class='table' style="background-color: #D1E7E8; border-radius: 50px;">


					<thead>
						<tr>
							<th>Student Name</th>
							<th>Semester</th>
							<th>Branch</th>
							<Th>Actions</Th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="student, iter : ${students}">
							<td th:text="${student.firstName} + ' ' + ${student.lastName}"></td>
							<td th:text="${student.semester}"></td>
							<td th:text="${student.branch.branchName}"></td>
							<td><a class="btn btn-sm btn-primary"
									th:href="@{/hod/assignClassPage/{studentID}/{branch}/{semester}(branch=${student.branch.id},semester=${student.semester},studentID=${student.ID})}">Assign
									Class</a></td>
						</tr>

					</tbody>

				</table>

			</div>
		</div>
	</main>
</body>
<div class="container">

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    th:insert="fragments/footer :: footer">
</div>
</html>
