<!-- Sidebar -->
 <th:block th:fragment="admin_header">

<script>
	$(document).ready(function () {
		// Restore active state
		let activeLink = localStorage.getItem("activeLink");
		if (activeLink) {
			$("#sidebarMenu a").removeClass("active");
			$("#sidebarMenu a[href='" + activeLink + "']").addClass("active");
		}

		// On click, set active and save
		$("#sidebarMenu a").click(function () {
			$("#sidebarMenu a").removeClass("active");
			$(this).addClass("active");
			localStorage.setItem("activeLink", $(this).attr("href"));

		});
	});
</script>
<nav id="sidebarMenu" class="collapse d-lg-block sidebar collapse">
	<div class="position-sticky">
		<div class="list-group list-group-flush mx-3 mt-4">

				aria-current="true"> <i class="fas fa-tachometer-alt fa-fw me-3"></i><img

					loading="lazy" />&nbsp;&nbsp;<span>

			</a>
			<a th:href="@{/registerProfessor}" class="list-group-item list-group-item-action py-2 ripple"> <i

					loading="lazy" />&nbsp;&nbsp;<span>

			</a>


		</div>
	</div>
</nav>
