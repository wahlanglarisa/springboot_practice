<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
	crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
	integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
	crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">Navbar scroll</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarScroll"
				aria-controls="navbarScroll" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarScroll">
				<ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll"
					style="--bs-scroll-height: 100px;">
					<li class="nav-item"><a class="nav-link active"
						aria-current="page" href="#">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="#">Link</a></li>
					<li class="nav-item dropdown"><a
						class="nav-link dropdown-toggle" href="#" role="button"
						data-bs-toggle="dropdown" aria-expanded="false"> Link </a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" href="#">Action</a></li>
							<li><a class="dropdown-item" href="#">Another action</a></li>
							<li><hr class="dropdown-divider"></li>
							<li><a class="dropdown-item" href="#">Something else
									here</a></li>
						</ul></li>
					<li class="nav-item"><a class="nav-link disabled"
						aria-disabled="true">Link</a></li>
				</ul>

				<span class="d-flex"><strong>Hi, [[${user}]]</strong></span>&nbsp;&nbsp;
				<span class="d-flex"><a th:href="@{/logout}">Logout</a></span>
			</div>
		</div>
	</nav>
	<div class="container text-center">
		<strong>Attendance for [[${course.courseName}]]</strong>
		<form th:action="@{/professor/saveAttendance/}" th:object="${class}"
			method="post">
			<table class="table">
				<tr>
					<th>Student Name</th>
					<th>Semester</th>
					<th>Attendance</th>
				</tr>
				<tr th:each="st,itemStat:${students}">
					<td th:text="${st.StudentName}"></td>
					<td th:text="${st.semester}"></td>
					<td><input type="radio"
						th:field="*{studentClasses[__${itemStat.index}__].student.ID}"
						th:value="${st.st_id}" required><label for="radio">Present</label>&nbsp;&nbsp;<input
						type="radio"
						th:field="*{studentClasses[__${itemStat.index}__].student.ID}"
						th:value="0"><label for="radio">Absent</label><input
						type="hidden"
						th:name="|studentClasses[${itemStat.index}].class_Course.id|"
						th:value="${st.class_id}"></td>

				</tr>
			</table>
			<input type='submit' class="btn btn-primary" value="Done">
		</form>
	</div>
</body>
<script type="text/javascript" th:src="@{/js/attendance.js}"></script>
</html>
