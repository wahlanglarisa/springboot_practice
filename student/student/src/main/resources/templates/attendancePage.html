<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
		integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<link th:href=@{/css/student.css} rel="stylesheet" />

</head>
<header th:insert="/fragments/prof_header :: prof_header"> </header>

<body>
	<br>
	<br>
	<br>
	<br>

	<main id="main-content">
		<div class="container text-center">
			<h3>Attendance for [[${course.courseName}]]</h3>
			<form th:action="@{/professor/saveAttendance/}" th:object="${class}" method="post">
				<table class="table">
					<tr>
						<th>Student Name</th>
						<th>Semester</th>
						<th>Attendance</th>
					</tr>
					<tr th:each="st,itemStat:${students}">
						<td th:text="${st.StudentName}"></td>
						<td th:text="${st.semester}"></td>
						<td><input type="radio" th:field="*{studentClasses[__${itemStat.index}__].student.ID}"
								th:value="${st.st_id}" required><label for="radio">Present</label>&nbsp;&nbsp;<input
								type="radio" th:field="*{studentClasses[__${itemStat.index}__].student.ID}"
								th:value="0"><label for="radio">Absent</label><input type="hidden"
								th:name="|studentClasses[${itemStat.index}].class_Course.id|" th:value="${st.class_id}">
						</td>

					</tr>
				</table>
				<input type='submit' class="btn btn-primary" value="Done">
			</form>
		</div>
	</main>
</body>
<script type="text/javascript" th:src="@{/js/attendance.js}"></script>
<div class="container">

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    th:insert="fragments/footer :: footer">
</div>
</html>
