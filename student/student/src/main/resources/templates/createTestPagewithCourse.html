<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
	crossorigin="anonymous">
<link th:href="@{/css/admin.css}" rel="stylesheet">
<link th:href=@{/css/student.css} rel="stylesheet" />

<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
	crossorigin="anonymous"></script>
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
	integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
	crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<header th:insert="/fragments/prof_header :: prof_header"> </header>

<body>
	
	<br>
	<br>
	<div class='container-md '>
		<div th:if="${param.success}">
			<div class="alert alert-info">You have successfully registered
				to our awesome app!!!!</div>

		</div>
		<form th:action="@{/professor/saveTest/}" method="post" th:object="${test}">
			<div th:if="${param.error}">
				<div class="alert alert-danger">Invalid username or password.</div>
			</div>
		<input type="hidden" name="professor" th:value="${profID}">
				<input type="hidden" name="course" th:value="${courseID}">
								<input type="hidden" name="class_Course" th:value="${classID}">
				
		
			<!-- logout message -->
			<div th:if="${param.logout}">
				<div class="alert alert-info">You have been logged out.</div>
			</div>
			<h1>
				<strong>Create Test for </strong>
			</h1>
			<br>
			<div class="mb-3 row">
				<label for="exampleFormControlInput1"
					class="form-label col col-sm-1">Enter Total Marks</label> <input
					type="number" class="form-control col" id="totalMarks"
					th:field="*{totalMarks}">
			</div>
			<div class="mb-3 row">
				<label for="exampleFormControlInput1"
					class="form-label col col-sm-1">Select the date</label> <input
					type="date" class="form-control col" id="st_name"
					th:field="*{date}">
			</div>
			<div class="mb-3 row">
				<label for="exampleFormControlTextarea1" class="form-label col-sm-1">Select the time</label> <input type="time" class="form-control col"
					id="time" 
					th:field="*{time}" >
			</div>
		<input type="submit" class="btn btn-primary form-submit justify-content-center">
			
		</form>
	</div>
</body>
<div class="container">

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    th:insert="fragments/footer :: footer">
</div>
<script type="text/javascript">
$(document).ready(function(){
	
	$("#toggle").change(function(){
	$("#hodid").val($(this).prop("checked")); 
	alert($("#hodid").val())
	})
});
</script>
</html>
