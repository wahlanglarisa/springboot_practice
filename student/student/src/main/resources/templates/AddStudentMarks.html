<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!--  -->
    <link th:href=@{/css/student.css} rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<header th:insert="/fragments/prof_header :: prof_header"> </header>

<body>
    <br>
    <br>
    <br>
    <br>
    <main id="main-content">

        <div class='container routineBlock'>
            <div th:if="${param.success}">
                <div class="alert alert-info">You have successfully registered
                    to our awesome app!!!!</div>

            </div>
            <form th:action="@{/professor/saveTestStudent/}" method="post" th:object="${testMarks}">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Course Name</th>
                            <th>Marks</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="testSt,item:${testStudents}">
                            <td th:text="${testSt.studentName}"></td>
                            <td th:text="${testSt.courseName}"></td>
                            <td><input type="number" class="form-control" placeholder="Enter the marks"
                                    th:field="*{testStudents[__${item.index}__].marks}"><input type="hidden" th:name="|testStudents[${item.index}].testStudentID|" th:value="${testSt.testStID}"></td>
                               <input type="hidden" th:name="|testStudents[${item.index}].student|" th:value="${testSt.stID}">
                               <input type="hidden" th:name="|testStudents[${item.index}].test|" th:value="${testSt.testID}">
                                </tr>
                    </tbody>

                </table>
                <input type="submit" class="form-submit form-control btn btn-primary">
            </form>
        </div>
    </main>
</body>
<div class="container">

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
    th:insert="fragments/footer :: footer">
</div>
</html>
