<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin Portal</title>

	<!-- ✅ Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<!--  -->
	<link th:href=@{/css/student.css} rel="stylesheet" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<link th:href="@{/css/main.css}" rel="stylesheet"/>
	<!-- ✅ jQuery (optional, for AJAX) -->
</head>
<header th:insert="/fragments/admin_header :: admin_header"></header>

<body class="p-5">
 
	<!-- ✅ Header should be INSIDE body -->

	<main id="main-content">
		<div class="container justify-content-center mt-5">

			<!-- Action buttons -->
			<div class="d-flex mb-3">
				<a th:href="@{/registerStudent}" class="btn btn-primary me-2">Add New Student</a>
				<a th:href="@{/registerProfessor}" class="btn btn-primary">Add New Professor</a>
			</div>

			<!-- ✅ Dropdown (outside table, position static) -->

			<!-- ✅ Table -->
			<table class="table">
				<thead>
					<tr>
						<th>
							<a
								th:href="@{'/admin/adminPortal/'+${currentPage}+'?sortField=email&sortDir='+${reverseSortDir}+'&role='+${role}}">
								User Email
							</a>
						</th>
						<th>
							<a
								th:href="@{'/admin/adminPortal/'+${currentPage}+'?sortField=firstName&sortDir='+${reverseSortDir}+'&role='+${role}}">
								First Name
							</a>
						</th>
						<th>
							<a
								th:href="@{'/admin/adminPortal/'+${currentPage}+'?sortField=lastName&sortDir='+${reverseSortDir}+'&role='+${role}}">
								Last Name
							</a>
						</th>
						<th>
							<div class="dropdown mb-3" style="position: static;">
								<button class="btn btn-secondary dropdown-toggle" type="button"
									data-bs-toggle="dropdown" aria-expanded="false">
									User Role (Select Option to Filter)
								</button>
								<ul class="dropdown-menu">
									<li>
										<a class="dropdown-item"
											th:href="@{'/admin/adminPortal/' + ${currentPage} + '?sortField=email&sortDir=' + ${reverseSortDir} + '&role=Guest'}">
											Guest
										</a>
									</li>
									<li>
										<a class="dropdown-item"
											th:href="@{'/admin/adminPortal/' + ${currentPage} + '?sortField=email&sortDir=' + ${reverseSortDir} + '&role=Admin'}">
											Admin
										</a>
									</li>
									
								</ul>
							</div>
						</th>
						<th>Action</th>
					</tr>
				</thead>

				<tbody id="user_body">
					<tr th:each="user : ${users}">
						<td th:text="${user.email}"></td>
						<td th:text="${user.firstName}"></td>
						<td th:text="${user.lastName}"></td>
						<td th:text="${user.roleName}"></td>
						<td>
							<a th:href="@{/admin/updateUserPage/{id}(id=${user.id})}" class="btn btn-primary">Update</a>
							<a th:href="@{/admin/deleteUserPage/{id}(id=${user.id})}" class="btn btn-danger">Delete</a>
						</td>
					</tr>
				</tbody>
			</table>

			<!-- ✅ Pagination -->
			<div id="pagenumbers" th:if="${totalPages > 1}" align="center" class="justify-content-center">
				<ul class="pagination justify-content-center">

					<!-- Previous Button -->
					<li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
						<a class="page-link"
							th:href="@{'/admin/adminPortal/' + (${currentPage} - 1) + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir} + '&role=' + ${role}}"
							aria-label="Previous">
							<span aria-hidden="true">&laquo;</span>
						</a>
					</li>

					<!-- Page Numbers -->
					<li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
						th:classappend="${pageNum == currentPage} ? 'active'">
						<a class="page-link"
							th:href="@{'/admin/adminPortal/' + ${pageNum} + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir} + '&role=' + ${role}}"
							th:text="${pageNum}"></a>
					</li>

					<!-- Next Button -->
					<li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
						<a class="page-link"
							th:href="@{'/admin/adminPortal/' + (${currentPage} + 1) + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir} + '&role=' + ${role}}"
							aria-label="Next">
							<span aria-hidden="true">&raquo;</span>
						</a>
					</li>

				</ul>
			</div>
		</div>

	</main>

	<!-- ✅ Footer -->

	<!-- ✅ Bootstrap Bundle JS (includes Popper) -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<!-- ✅ JS Debug and Ajax -->
	<script th:inline="javascript">
		console.log("✅ Bootstrap test:", typeof bootstrap);

		function clicked() {
			alert(document.getElementById("role_Select").value);
			$.ajax({
				url: "/admin/adminPortalAjax/" + 1 + "?sortField=email&sortDir=asc",
				method: "get",
				dataType: "json",
				data: {
					role: document.getElementById("role_Select").value
				},
				success: function (response) {
					const courseElement = document.getElementById("user_body");
					courseElement.innerHTML = "";
					response.forEach((element, i) => {
						const newRow = courseElement.insertRow(i);
						newRow.insertCell(0).innerHTML = element.email;
						newRow.insertCell(1).innerHTML = element.firstName;
						newRow.insertCell(2).innerHTML = element.lastName;
						newRow.insertCell(3).innerHTML = element.roleName;
						newRow.insertCell(4).innerHTML = `
              <a href='/admin/updateUserPage/${element.id}' class="btn btn-primary">Update</a>
              <a href='/admin/deleteUserPage/${element.id}' class="btn btn-danger">Delete</a>
            `;
					});

					if (response.length > 10) {
						let innerHtml = '<div class="row justify-content-center" align="center">';
						for (let i = 0; i < response.length; i++) {
							innerHtml += `
                <span class="page-item">
                  <a href="http://127.0.0.1/admin/adminPortal/${i}?sortField=email&sortDir=asc" class="page-link">${i}</a>
                </span>`;
						}
						innerHtml += "</div>";
						document.getElementById("pagenumbers").innerHTML = innerHtml;
					} else {
						document.getElementById("pagenumbers").innerHTML = "";
					}
				},
				error: function (xhr, status, error) {
					console.log(xhr, status, error);
				}
			});
		}
	</script>
</body>
<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
	th:insert="fragments/footer :: footer"></footer>

</html>
